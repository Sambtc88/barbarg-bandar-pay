name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Buildozer and dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36 flet

    - name: Create buildozer.spec
      run: |
        if [ ! -f buildozer.spec ]; then
          cat << 'EOF' > buildozer.spec
          [app]
          title = Barbarg Bandar
          package.name = barbargbandar
          package.domain = org.barbarg
          source.include_exts = py,png,jpg,kv,atlas
          source.dir = .
          version = 1.0
          requirements = python3,flet
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          EOF
        fi

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Barbarg-Bandar-APK
        path: bin/*.apk
