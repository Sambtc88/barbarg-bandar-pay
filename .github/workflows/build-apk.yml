name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.25.2" httpx==0.27.0

      - name: Build APK with Flet
        run: |
          flet build apk --project "BarGoBandar" --org "ir.bandar.bargobandar" --android-permissions INTERNET -v > build.log 2>&1 || (cat build.log && exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarGo-APK
          path: build/apk/*.apk
