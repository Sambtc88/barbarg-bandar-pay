name: Build Barbarg Bandar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Flet
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Create App Package Info
      run: |
        echo "Preparing Barbarg Bandar App files..."
        # بررسی وجود فایل اصلی
        ls -la

    # در اینجا فایل خروجی به عنوان نمونه فشرده و آماده دانلود می‌شود
    - name: Package App Files for Download
      run: |
        mkdir -p output_app
        cp main.py output_app/
        cd output_app && zip -r ../barbarg-bandar.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Barbarg-Bandar-App
        path: barbarg-bandar.zip
