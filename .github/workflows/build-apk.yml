name: Build Barbarg Bandar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Flet and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Verify Project Files
      run: |
        echo "Building Barbarg Bandar App..."
        ls -la
